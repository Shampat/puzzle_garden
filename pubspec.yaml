name: puzzle_garden
description: Puzzle Garden - Relax. Think. Grow.
publish_to: 'none'
version: 1.0.3+4
environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/puzzles.json
    - assets/legal/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon_alpha.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#FFFBF0"
    theme_color: "#4CAF50"
  adaptive_icon_background: "#FFFBF0"
  adaptive_icon_foreground: "assets/icons/icon_alpha.png"
